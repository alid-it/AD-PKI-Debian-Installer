name: Release Debian Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Debian package version without the leading v
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apt-repository
  cancel-in-progress: false

jobs:
  build-deb:
    name: Build Debian package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Debian installer
        uses: actions/checkout@v4

      - name: Install base build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apt-utils \
            build-essential \
            devscripts \
            fakeroot \
            gnupg \
            dpkg-dev

      - name: Install package build-deps
        working-directory: adpki-installer
        run: |
          sudo apt-get build-dep -y ./

      - name: Verify build dependencies
        working-directory: adpki-installer
        run: |
          dpkg -l build-essential | tail -1
          dpkg-checkbuilddeps

      - name: Validate maintainer scripts
        working-directory: adpki-installer
        run: |
          bash -n debian/postinst
          bash -n package-files/usr/lib/adpki/setup/steps/80-webui-tls.sh

      - name: Extract version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${MANUAL_VERSION#v}"
            TAG="v${VERSION}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+~.-][0-9A-Za-z.+~:-]+)?$ ]]; then
            echo "Invalid Debian package version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Update Debian changelog version
        working-directory: adpki-installer
        env:
          DEBEMAIL: danakiranali@gmail.com
          DEBFULLNAME: Ali Danakiran
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if [ -f debian/changelog ]; then
            dch --newversion "$VERSION" \
              --distribution stable \
              --force-distribution \
              "Release version $VERSION"
          fi

      - name: Build Debian package
        working-directory: adpki-installer
        run: |
          fakeroot dpkg-buildpackage -us -uc -b

      - name: Collect package files
        run: |
          mkdir -p release

          find . -maxdepth 1 -type f -name "*.deb"       -exec cp {} release/ \;
          find . -maxdepth 1 -type f -name "*.buildinfo" -exec cp {} release/ \;
          find . -maxdepth 1 -type f -name "*.changes"   -exec cp {} release/ \;

          cd release

          VERSIONED_DEB="$(find . -maxdepth 1 -type f -name 'adpki_*_amd64.deb' | head -n1)"

          if [ -z "$VERSIONED_DEB" ]; then
            echo "No amd64 Debian package found."
            exit 1
          fi

          cp "$VERSIONED_DEB" adpki_amd64.deb

          sha256sum \
            "$(basename "$VERSIONED_DEB")" \
            adpki_amd64.deb \
            > SHA256SUMS

          ls -lah

      - name: Verify Nginx configuration ownership
        run: |
          set -euo pipefail

          VERSIONED_DEB="$(find release -maxdepth 1 -type f -name 'adpki_[0-9]*_amd64.deb' | head -n1)"
          CONTENTS="$(dpkg-deb --contents "$VERSIONED_DEB")"

          grep -Fq './usr/share/adpki/nginx/templates/adpki.conf' <<< "$CONTENTS"
          grep -Fq './usr/share/adpki/nginx/templates/adpki-https.conf' <<< "$CONTENTS"

          if grep -Fq './etc/nginx/sites-available/adpki.conf' <<< "$CONTENTS"; then
            echo 'The active AD-PKI Nginx site must not be shipped as a dpkg conffile.'
            exit 1
          fi

          if grep -Fq './etc/nginx/sites-available/adpki-https.conf' <<< "$CONTENTS"; then
            echo 'The AD-PKI HTTPS template must be installed under /usr/share.'
            exit 1
          fi

      - name: Upload package to central AD-PKI release
        env:
          GH_TOKEN: ${{ secrets.ADPKI_RELEASE_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          gh release view "$TAG" \
            --repo alid-it/AD-PKI \
          || gh release create "$TAG" \
            --repo alid-it/AD-PKI \
            --title "AD-PKI $TAG" \
            --notes "Central AD-PKI release $TAG"

          gh release upload "$TAG" \
            release/*.deb \
            release/SHA256SUMS \
            --repo alid-it/AD-PKI \
            --clobber

      - name: Collect versioned packages for APT
        env:
          GH_TOKEN: ${{ secrets.ADPKI_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p apt-packages
          cp release/adpki_[0-9]*_amd64.deb apt-packages/

          gh api --paginate '/repos/alid-it/AD-PKI/releases?per_page=100' \
            --jq '.[].tag_name' \
          | while IFS= read -r tag; do
              gh release download "$tag" \
                --repo alid-it/AD-PKI \
                --pattern 'adpki_[0-9]*_amd64.deb' \
                --dir apt-packages \
                --skip-existing \
              || true
            done

          find apt-packages -maxdepth 1 -type f -name '*.deb' -print

      - name: Build APT repository metadata
        run: |
          chmod +x scripts/build-apt-repository.sh
          scripts/build-apt-repository.sh apt-packages apt-repository

      - name: Sign APT repository metadata
        id: signing
        env:
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
          APT_SIGNING_KEY_FINGERPRINT: ${{ secrets.APT_SIGNING_KEY_FINGERPRINT }}
          APT_SIGNING_KEY_PASSPHRASE: ${{ secrets.APT_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [ -z "$APT_SIGNING_PRIVATE_KEY" ] || [ -z "$APT_SIGNING_KEY_FINGERPRINT" ]; then
            echo "APT signing secrets are not configured."
            exit 1
          fi

          install -d -m 0700 "$HOME/.gnupg"
          printf '%s\n' "$APT_SIGNING_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$APT_SIGNING_KEY_FINGERPRINT" >/dev/null

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$APT_SIGNING_KEY_PASSPHRASE" \
            --local-user "$APT_SIGNING_KEY_FINGERPRINT" \
            --clearsign \
            --output apt-repository/dists/stable/InRelease \
            apt-repository/dists/stable/Release

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$APT_SIGNING_KEY_PASSPHRASE" \
            --local-user "$APT_SIGNING_KEY_FINGERPRINT" \
            --armor --detach-sign \
            --output apt-repository/dists/stable/Release.gpg \
            apt-repository/dists/stable/Release

          gpg --batch --armor --export "$APT_SIGNING_KEY_FINGERPRINT" \
            > apt-repository/adpki-archive-keyring.asc

          echo "fingerprint=$APT_SIGNING_KEY_FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload APT repository as Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apt-repository

  deploy-apt-repository:
    name: Deploy APT repository
    needs: build-deb
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
