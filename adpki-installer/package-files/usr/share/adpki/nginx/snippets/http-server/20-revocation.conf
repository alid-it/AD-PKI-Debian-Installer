# CRL and OCSP objects are signed and intentionally available over HTTP.
location ^~ /api/crl/ {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/adpki-fpm.sock;
    fastcgi_param SCRIPT_FILENAME /opt/adpki/backend/public/index.php;
    fastcgi_param DOCUMENT_ROOT /opt/adpki/backend/public;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_param HTTPS off;
}

location = /api/ocsp {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/adpki-fpm.sock;
    fastcgi_param SCRIPT_FILENAME /opt/adpki/backend/public/index.php;
    fastcgi_param DOCUMENT_ROOT /opt/adpki/backend/public;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_param HTTPS off;
}
